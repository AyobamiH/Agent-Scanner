[project]
name = "agent-scanner"
version = "1.0.0"
description = "scanner for detecting agentic code across GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Lloyds Bank PLC" }]
license = { text = "MIT" }
keywords = ["agent", "scanner", "agentic", "llm", "ai"]
dependencies = [
    "requests>=2.31,<3",
    "urllib3>=2.1,<3",
    "pyyaml>=6.0",
    "psutil>=5.9,<8",
    "python-dotenv>=1.0",
    "jsonschema>=4.22,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "coverage>=7.4,<8",
    "pytest-cov>=5.0,<6",
    "ruff>=0.8,<1",
    "mypy>=1.8,<2",
    "black>=24.10,<25",
    "types-pyyaml>=6.0",
    "types-requests>=2.32; python_version >= '3.9'",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-fail-under=70"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q", "S"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
agent-scanner = "src.main:main"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/utils/rate_limiter.py" = ["S311"]
"src/github/filesystem_client.py" = ["S603", "S607"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
skip-string-normalization = false

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
install_types = true
non_interactive = true
disallow_untyped_defs = true