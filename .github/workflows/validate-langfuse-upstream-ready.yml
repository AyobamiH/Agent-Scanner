name: Validate upstream-ready Langfuse change

on:
  push:
    branches:
      - validate/langfuse-upstream-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: python -m uv sync
      - name: Install mypy stub packages
        run: python -m uv pip install --python .venv/bin/python types-jsonschema types-toml types-PySocks
      - name: Run full test suite
        run: python -m uv run pytest
      - name: Run Ruff
        run: python -m uv run ruff check src tests
      - name: Run mypy
        run: python -m uv run mypy src
