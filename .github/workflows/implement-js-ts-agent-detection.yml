name: Implement and validate JS/TS agent detection

on:
  push:
    branches:
      - feat/js-ts-agent-factory-detection
    paths:
      - .github/workflows/implement-js-ts-agent-detection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/js-ts-agent-factory-detection
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: python -m uv sync

      - name: Install mypy stub packages
        run: python -m uv pip install --python .venv/bin/python types-jsonschema types-toml types-PySocks

      - name: Wire JS/TS detector into scanner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/scanner/scanner.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from src.detectors.agents.agents import AgentDetector\n",
                  "from src.detectors.agents.agents import AgentDetector\n"
                  "from src.detectors.agents.javascript_agents import JavaScriptAgentDetector\n",
              ),
              (
                  "        self.agent_detector = AgentDetector()\n"
                  "        self.framework_detector = FrameworkDetector()\n",
                  "        self.agent_detector = AgentDetector()\n"
                  "        self.javascript_agent_detector = JavaScriptAgentDetector()\n"
                  "        self.framework_detector = FrameworkDetector()\n",
              ),
              (
                  "                elif path_lower.endswith((\".yaml\", \".yml\", \".json\")):\n"
                  "                    agent_locations = self.agent_detector.get_structured_agent_locations(content, path)\n"
                  "                else:\n"
                  "                    agent_locations = []\n",
                  "                elif path_lower.endswith(JavaScriptAgentDetector.SUPPORTED_EXTENSIONS):\n"
                  "                    framework_imports = self.javascript_agent_detector.get_framework_imports(content)\n"
                  "                    agent_locations = self.javascript_agent_detector.get_agent_locations(content)\n"
                  "                elif path_lower.endswith((\".yaml\", \".yml\", \".json\")):\n"
                  "                    agent_locations = self.agent_detector.get_structured_agent_locations(content, path)\n"
                  "                else:\n"
                  "                    agent_locations = []\n",
              ),
              (
                  "                    elif path_lower.endswith((\".yaml\", \".yml\", \".json\", \".bru\")):\n"
                  "                        locations = self.agent_detector.get_structured_agent_locations(content, path_lower)\n"
                  "                    else:\n"
                  "                        locations = []\n",
                  "                    elif path_lower.endswith(JavaScriptAgentDetector.SUPPORTED_EXTENSIONS):\n"
                  "                        framework_imports = self.javascript_agent_detector.get_framework_imports(content)\n"
                  "                        locations = self.javascript_agent_detector.get_agent_locations(content)\n"
                  "                    elif path_lower.endswith((\".yaml\", \".yml\", \".json\", \".bru\")):\n"
                  "                        locations = self.agent_detector.get_structured_agent_locations(content, path_lower)\n"
                  "                    else:\n"
                  "                        locations = []\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one scanner patch target, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run focused JS/TS tests
        run: python -m uv run pytest tests/detectors/agents/test_javascript_agents.py -q --no-cov

      - name: Run full test suite
        run: python -m uv run pytest

      - name: Run Ruff
        run: python -m uv run ruff check src tests

      - name: Run mypy
        run: python -m uv run mypy src

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-js-ts-agent-detection.yml
          git add src/scanner/scanner.py src/detectors/agents/javascript_agents.py tests/detectors/agents/test_javascript_agents.py
          git commit -m "feat: detect LangChain agents in JavaScript and TypeScript"
          git push origin HEAD:feat/js-ts-agent-factory-detection
