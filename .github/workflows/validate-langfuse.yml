name: Validate Langfuse dependency detection

on:
  push:
    branches:
      - validate/langfuse-dependency-detection
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: python -m uv sync
      - name: Run tests
        run: python -m uv run pytest
      - name: Run Ruff
        run: python -m uv run ruff check src tests
      - name: Run mypy
        run: python -m uv run mypy src
